<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五线谱随机读谱练习器 (修复加线版)</title>
    <!-- 引入专业乐谱渲染库 VexFlow -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@1.2.93/releases/vexflow-min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* 针对手机端及平板（屏幕宽度 <= 1024px）：强制乐谱容器和每一行都占满全宽、单列显示 */
        @media screen and (max-width: 1024px) {
            .measure, .stave-container, svg, div[id*="vf-"] {
                width: 100% !important;
                max-width: 100% !important;
                display: block !important;
                margin: 10px auto !important;
                float: none !important;
            }
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 980px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }
        .stats span b {
            color: #2563eb;
        }
        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            background: #f1f5f9;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
        }
        .settings-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }
        .settings-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .settings-panel select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-size: 13px;
            background: #fff;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }
        #staff-container {
            width: 100%;
            height: 170px;
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        #staff-container:hover {
            border-color: #94a3b8;
        }
        .tip {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .progress-indicator {
            font-size: 15px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 15px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-note {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-note:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        .btn-note:active {
            transform: translateY(0);
        }
        #feedback {
            font-size: 16px;
            height: 24px;
            font-weight: bold;
        }
        .correct { color: #16a34a; }
        .wrong { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>五线谱读谱闪卡练习 (修复加线版)</h1>
    
    <div class="stats">
        <span>总题数: <b id="total-count">0</b></span>
        <span>正确率: <b id="accuracy">0%</b></span>
        <span>当前连击: <b id="streak">0</b></span>
    </div>

    <!-- 控制设置面板 -->
    <div class="settings-panel">
        <div class="settings-row">
            <div class="settings-group">
                <label for="clef-select">谱号：</label>
                <select id="clef-select">
                    <option value="treble">高音谱号 (Treble)</option>
                    <option value="bass">低音谱号 (Bass)</option>
                </select>
            </div>
            <div class="settings-group">
                <label for="range-select">音符范围：</label>
                <select id="range-select">
                    <option value="standard">标准音域 (五线谱内)</option>
                    <option value="ledger" selected>包含加线 (含上下加线)</option>
                    <option value="all">扩展全音域 (宽广音区)</option>
                </select>
            </div>
        </div>
        <div class="settings-row">
            <span style="font-weight: 500; color: #475569;">选择允许出现的音符与休止符：</span>
            <div class="checkbox-group">
                <label><input type="checkbox" name="element" value="note-w"> 全音符(4拍)</label>
                <label><input type="checkbox" name="element" value="note-h"> 二分音符(2拍)</label>
                <label><input type="checkbox" name="element" value="note-q" checked> 四分音符(1拍)</label>
                <label><input type="checkbox" name="element" value="note-8" checked> 八分音符(0.5拍)</label>
                <label><input type="checkbox" name="element" value="note-16"> 十六分音符(0.25拍)</label>
                <label style="color: #0284c7; font-weight: 500;"><input type="checkbox" name="element" value="rest-w"> 全休止符</label>
                <label style="color: #0284c7; font-weight: 500;"><input type="checkbox" name="element" value="rest-h"> 二分休止符</label>
                <label style="color: #0284c7; font-weight: 500;"><input type="checkbox" name="element" value="rest-q" checked> 四分休止符</label>
                <label style="color: #0284c7; font-weight: 500;"><input type="checkbox" name="element" value="rest-8"> 八分休止符</label>
            </div>
        </div>
    </div>

    <!-- 宽幅专业 VexFlow 乐谱渲染区 -->
    <div id="staff-container" title="点击可连续重听发音">
        <div id="vexflow-canvas"></div>
    </div>
    
    <div class="progress-indicator" id="progress-text">请依次输入乐谱中的音符</div>
    <div class="tip">💡 提示：加线模式现已正确包含上加线与下加线音符</div>

    <!-- 答题按钮 -->
    <div class="buttons">
        <button class="btn-note" data-note="C">C</button>
        <button class="btn-note" data-note="D">D</button>
        <button class="btn-note" data-note="E">E</button>
        <button class="btn-note" data-note="F">F</button>
        <button class="btn-note" data-note="G">G</button>
        <button class="btn-note" data-note="A">A</button>
        <button class="btn-note" data-note="B">B</button>
    </div>

    <div id="feedback"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        let total = 0;
        let correct = 0;
        let streak = 0;

        let playableNotes = []; 
        let allElements = [];   
        let currentIndex = 0;  

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 0.4) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);
        }

        function playAllMeasures() {
            let delay = 0;
            allElements.forEach((el) => {
                let interval = 400;
                if (el.duration === 'w') interval = 1200;
                else if (el.duration === 'h') interval = 800;
                else if (el.duration === 'q') interval = 400;
                else if (el.duration === '8') interval = 200;
                else if (el.duration === '16') interval = 100;

                if (!el.isRest) {
                    let duration = interval * 0.9;
                    setTimeout(() => {
                        playTone(el.freq, duration / 1000);
                    }, delay);
                }
                delay += interval;
            });
        }
